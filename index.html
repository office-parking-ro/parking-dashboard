<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151515">
  <meta name="description" content="Available parking spaces">
  <title>Available Spaces</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #151515;
      --yellow: #ffbd05;
      --yellow-soft: #eaa900;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--yellow);
      background:
        linear-gradient(125deg, rgba(255,255,255,.025) 0%, transparent 36%),
        radial-gradient(ellipse 70% 75% at 50% 45%, #343434 0%, #222222 49%, var(--background) 100%);
      font-family: Arial, Helvetica, sans-serif;
    }
    /* Subtle architectural lines inspired by the charcoal/yellow reference. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(90deg, transparent 0, transparent 109px, rgba(255,255,255,.022) 110px),
        linear-gradient(113deg, transparent 0 20%, rgba(255,255,255,.025) 20.1%, transparent 20.3% 75%, rgba(255,255,255,.022) 75.1%, transparent 75.3%);
      opacity: .58;
    }
    main {
      position: relative;
      z-index: 1;
      width: min(94vw, 1400px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(20px, 4vh, 46px);
      padding: 32px 10px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4.8vw, 5.5rem);
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: -.055em;
      text-transform: uppercase;
      text-wrap: balance;
    }
    #available {
      display: block;
      color: var(--yellow);
      font-size: clamp(2.975rem, 5.18vw, 5.6rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.03em;
      font-variant-numeric: tabular-nums;
    }

    #available.is-offline {
      max-width: min(92vw, 1000px);
      font-size: clamp(1.15rem, 2.7vw, 2.4rem);
      line-height: 1.4;
      font-weight: 500;
      letter-spacing: 0;
      text-wrap: balance;
    }
    @media (max-width: 540px) {
      h1 { font-size: clamp(1.9rem, 7.5vw, 3.2rem); letter-spacing: -.04em; }
      #available { font-size: clamp(4rem, 16vw, 6.5rem); }
    }
  </style>
</head>
<body>
  <main>
    <h1>AVAILABLE SPACES</h1>
    <output id="available" aria-label="Number of available parking spaces" aria-live="polite">--</output>
  </main>
  <script>
    // Public Gist only. No parking API credentials are stored in this page.
    const GITHUB_USERNAME = 'spielmannlaszlo11-dotcom';
    const GIST_ID = '9cc975e2d6d46b1fbef3409729fbccab';
    const OFFLINE_MESSAGE = 'Parking availability is shown Monday to Friday, 07:00-16:00.';
    const CLOCK_CHECK_MS = 5 * 1000; // Check the local clock, not the parking API.
    const output = document.getElementById('available');

    // All scheduling follows Romania time, including daylight saving time.
    const romanianClock = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Bucharest',
      weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
    });

    function getScheduleState(now = new Date()) {
      const time = Object.fromEntries(romanianClock.formatToParts(now)
        .filter(part => part.type !== 'literal')
        .map(part => [part.type, part.value]));
      const minuteOfDay = Number(time.hour) * 60 + Number(time.minute);
      const workday = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].includes(time.weekday);
      const open = workday && minuteOfDay >= 7 * 60 && minuteOfDay < 16 * 60;
      if (!open) return {open: false, bucket: null};

      const day = `${time.year}-${time.month}-${time.day}`;
      const morning = minuteOfDay < 10 * 60;
      const bucket = morning
        ? `30s:${day}:${minuteOfDay}:${Math.floor(Number(time.second) / 30)}`
        : `2m:${day}:${Math.floor(minuteOfDay / 2)}`;
      return {open: true, bucket};
    }

    let lastRequestedBucket = null;

    async function updateAvailableSpaces(bucket) {
      try {
        const url = `https://gist.githubusercontent.com/${GITHUB_USERNAME}/${GIST_ID}/raw/parking.json?t=${Date.now()}`;
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Parking data request failed: ${response.status}`);
        const groups = await response.json();
        if (!Array.isArray(groups) || groups.length === 0) throw new Error('No parking groups were returned');
        let available = 0;
        for (const group of groups) {
          const capacity = Number(group.capacity);
          const occupied = Number(group.occupation);
          if (!Number.isFinite(capacity) || !Number.isFinite(occupied) || capacity < 0 || occupied < 0) {
            throw new Error('Invalid parking group data');
          }
          available += Math.max(0, capacity - occupied);
        }
        // Ignore old requests if another reading started or opening hours ended.
        const state = getScheduleState();
        if (!state.open || state.bucket !== bucket || lastRequestedBucket !== bucket) return;
        output.classList.remove('is-offline');
        output.textContent = available.toLocaleString('en-US');
      } catch (error) {
        // Keep the last valid figure during opening hours; never treat a failure as zero.
        console.error('Unable to refresh parking availability:', error);
      }
    }

    function checkSchedule() {
      const state = getScheduleState();
      if (!state.open) {
        output.classList.add('is-offline');
        output.textContent = OFFLINE_MESSAGE;
        lastRequestedBucket = null;
        return;
      }
      if (output.classList.contains('is-offline')) {
        output.classList.remove('is-offline');
        output.textContent = '--';
      }
      if (state.bucket !== lastRequestedBucket) {
        lastRequestedBucket = state.bucket;
        updateAvailableSpaces(state.bucket);
      }
    }

    checkSchedule();
    setInterval(checkSchedule, CLOCK_CHECK_MS);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkSchedule();
    });
    window.addEventListener('focus', checkSchedule);
  </script>
</body>
</html>
